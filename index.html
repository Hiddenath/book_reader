<!DOCTYPE html>
<html lang="ru" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookHaven 3D</title>
  <link rel="icon" type="image/svg+xml" href="book.svg">
    <link rel="stylesheet" href="css/main.css?v=20260903d">
    <link rel="stylesheet" href="css/reader.css?v=20260903d">
    <link rel="stylesheet" href="css/library.css?v=20260903d">
</head>
<body>
  <!-- Библиотека -->
  <section class="library" id="library">
    <div class="library-header">
      <div class="library-brand">
        <img class="library-logo" src="book.svg?v=20260903a" alt="BookHaven" width="58" height="43">
        <h1 class="library-title">Библиотека</h1>
      </div>
      <span class="library-count" id="libraryCount">0 книг</span>
    </div>
    <div class="book-grid" id="bookGrid"></div>
  </section>

  <!-- FAB добавления книги (SVG-иконки меняются из JS: + / ▶ / ■) -->
  <button class="fab" id="fabAdd" title="Добавить книгу">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
  <input type="file" id="fileInput" accept=".txt,.epub,.fb2" multiple hidden>

  <!-- Drag&drop оверлей -->
  <div class="drop-overlay" id="dropOverlay">Отпустите TXT, EPUB или FB2-файл, чтобы добавить книгу</div>

  <!-- Индикатор загрузки книги -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Открываю книгу…</div>
  </div>

  <!-- 3D-сцена читалки -->
  <main class="scene" id="scene">
    <div class="book" id="book">
      <!-- Твёрдая обложка под разворотом (hardcover) -->
      <div class="book-shell" aria-hidden="true"></div>

      <!-- Статичные страницы под разворотом -->
      <div class="page page-left">
        <div class="page-content" id="contentUnderLeft"></div>
      </div>
      <div class="page page-right">
        <div class="page-content" id="contentUnderRight"></div>
      </div>

      <!-- Перелистываемые листы (создаются динамически) -->
      <div id="flipLayer"></div>

      <!-- Маркер закладки на краю страницы -->
      <div class="bookmark-marker" id="bookmarkMarker"></div>
    </div>
  </main>

  <!-- Панель закладок -->
  <aside class="bookmarks-panel" id="bookmarksPanel">
    <div class="bookmarks-header">
      <h3>Закладки</h3>
      <button class="bookmarks-close" id="bookmarksClose" title="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="bookmarks-list" id="bookmarksList"></div>
    <button class="bookmarks-add" id="btnAddBookmark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>Закладка на этой странице</span>
    </button>
  </aside>

  <!-- Панель оглавления -->
  <aside class="bookmarks-panel" id="tocPanel">
    <div class="bookmarks-header">
      <h3>Оглавление</h3>
      <button class="bookmarks-close" id="tocClose" title="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="bookmarks-list" id="tocList"></div>
  </aside>

  <!-- Нижняя панель управления -->
  <footer class="toolbar" id="toolbar">
    <button class="tb-btn" id="btnLibrary" title="Библиотека">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="tb-progress">
      <div class="progress-line"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">стр. 1 / 1</span>
    </div>
    <button class="tb-btn" id="btnToc" title="Оглавление">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"/></svg>
    </button>
    <button class="tb-btn" id="btnBookmark" title="Закладки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H7v18l5-4 5 4V3z"/></svg>
    </button>
    <button class="tb-btn" id="btnSettings" title="Настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.31.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
    </button>
  </footer>

  <!-- Боковые зоны листания -->
  <div class="nav-zone nav-left" id="navLeft"></div>
  <div class="nav-zone nav-right" id="navRight"></div>

  <!-- Панель настроек (slide-up) -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-panel-header">
      <button class="settings-close" id="settingsClose" title="Скрыть панель">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="settings-section">
      <h3>Шрифт</h3>
      <label>Размер шрифта
        <input type="range" id="setFontSize" min="14" max="30" step="1" value="18">
      </label>
      <label>Межстрочный интервал
        <input type="range" id="setLineHeight" min="1.0" max="2.5" step="0.1" value="1.6">
      </label>
    </div>
    <div class="settings-section">
      <h3>Тема</h3>
      <div class="theme-picker" id="themePicker">
        <button class="theme-dot" data-theme-name="paper" style="--dot:#f7f3ea" title="Бумага"></button>
        <button class="theme-dot" data-theme-name="sepia" style="--dot:#f3e5c8" title="Сепия"></button>
        <button class="theme-dot" data-theme-name="night" style="--dot:#1a1d23" title="Ночной"></button>
        <button class="theme-dot" data-theme-name="forest" style="--dot:#e4ecda" title="Лес"></button>
        <button class="theme-dot" data-theme-name="sky" style="--dot:#dcebf5" title="Небо"></button>
        <button class="theme-dot" data-theme-name="ember" style="--dot:#241a14" title="Угли (OLED)"></button>
        <button class="theme-dot" data-theme-name="amber" style="--dot:#000; border-color:#ffc94d" title="Янтарь (OLED)"></button>
      </div>
    </div>
    <div class="settings-section">
      <h3>Отступы</h3>
      <label>Горизонтальные отступы
        <input type="range" id="setMargins" min="10" max="100" step="5" value="60">
      </label>
      <label>Вертикальные отступы
        <input type="range" id="setVMargins" min="10" max="100" step="5" value="50">
      </label>
    </div>
    <div class="settings-section">
      <h3>Перелистывание страниц</h3>
      <div class="toggle-row">
        <label class="toggle-switch">
          <input type="checkbox" id="setPageFlipAnimation" checked>
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
        <span class="toggle-label">Анимация</span>
      </div>
      <div class="toggle-row">
        <label class="toggle-switch">
          <input type="checkbox" id="setFlipSound" checked>
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
        <span class="toggle-label">Звук перелистывания</span>
      </div>
      <div class="toggle-row">
        <label class="toggle-switch">
          <input type="checkbox" id="setNarratorAutoFlip" checked>
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
        <span class="toggle-label">Автоперелистывание при чтении</span>
      </div>
    </div>
    <div class="settings-section">
      <h3>Перенос слов</h3>
      <div class="toggle-row">
        <label class="toggle-switch">
          <input type="checkbox" id="setHyphenation" checked>
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </div>
    </div>
  </div>

  <!-- Сторонние библиотеки (скачаны в /lib/): JSZip нужен для epub.js -->
  <script src="lib/jszip.min.js"></script>
  <script src="lib/epub.js"></script>

  <!-- Точка входа приложения -->
     <script type="module" src="js/main.js?v=20260903e"></script>
</body>
</html>
